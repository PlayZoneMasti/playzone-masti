
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayZone Masti - Snake Game</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#101827,#172c42);
 color:white;text-align:center;
 padding:20px 10px;
}
h1{color:#35e69a;margin:10px}
p{color:#cbd5e1}
.game{
 max-width:440px;margin:20px auto;
 background:#1e293b;padding:15px;
 border-radius:18px;
 box-shadow:0 8px 30px #0006;
}
.score{font-size:22px;color:#35e69a;margin:12px}
canvas{
 width:100%;max-width:380px;
 background:#07131b;
 border:3px solid #35e69a;
 border-radius:10px;
 display:block;margin:auto;
}
button{
 border:0;border-radius:10px;
 padding:12px 20px;margin:6px;
 font-size:16px;font-weight:bold;
 background:#35e69a;color:#102030;
 cursor:pointer;
}
.controls{
 display:grid;grid-template-columns:repeat(3,65px);
 justify-content:center;gap:7px;margin-top:15px;
}
.controls button{margin:0;padding:14px}
footer{margin-top:25px;color:#94a3b8;font-size:13px}
</style>
</head>
<body>
<h1>🎮 PlayZone Masti</h1>
<p>Free Online Snake Game</p>

<div class="game">
<div class="score">Score: <span id="score">0</span></div>
<canvas id="board" width="380" height="380"></canvas>
<button onclick="startGame()">▶ Start / Restart</button>
<div class="controls">
<div></div><button onclick="change(0,-1)">⬆️</button><div></div>
<button onclick="change(-1,0)">⬅️</button>
<button onclick="change(0,1)">⬇️</button>
<button onclick="change(1,0)">➡️</button>
</div>
<p id="message">Start दबाकर गेम खेलें!</p>
</div>

<footer>© 2026 PlayZone Masti | Enjoy Free Games</footer>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const size=19;
let snake,food,dx,dy,score,timer,playing=false;

function randomFood(){
 return {
 x:Math.floor(Math.random()*20),
 y:Math.floor(Math.random()*20)
 };
}
function draw(){
 ctx.fillStyle="#07131b";
 ctx.fillRect(0,0,380,380);
 ctx.fillStyle="#ff4757";
 ctx.beginPath();
 ctx.arc(food.x*19+9.5,food.y*19+9.5,8,0,Math.PI*2);
 ctx.fill();
 snake.forEach((part,i)=>{
 ctx.fillStyle=i===0?"#35e69a":"#16a36c";
 ctx.fillRect(part.x*19+1,part.y*19+1,17,17);
 });
}
function startGame(){
 clearInterval(timer);
 snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
 dx=1;dy=0;score=0;
 document.getElementById("score").textContent=score;
 document.getElementById("message").textContent="खेल शुरू हो गया!";
 food=randomFood();
 playing=true;draw();
 timer=setInterval(move,130);
}
function change(x,y){
 if(!playing)return;
 if(x===-dx && y===-dy)return;
 dx=x;dy=y;
}
function move(){
 let head={x:snake[0].x+dx,y:snake[0].y+dy};
 if(head.x<0||head.x>=20||head.y<0||head.y>=20||
 snake.some(p=>p.x===head.x&&p.y===head.y)){
 gameOver();return;
 }
 snake.unshift(head);
 if(head.x===food.x&&head.y===food.y){
 score+=10;
 document.getElementById("score").textContent=score;
 do{food=randomFood()}
 while(snake.some(p=>p.x===food.x&&p.y===food.y));
 }else{snake.pop()}
 draw();
}
function gameOver(){
 clearInterval(timer);playing=false;
 document.getElementById("message").textContent=
 "गेम खत्म! आपका स्कोर: "+score+" — फिर से खेलें!";
}
document.addEventListener("keydown",e=>{
 const keys={
 ArrowUp:[0,-1],ArrowDown:[0,1],
 ArrowLeft:[-1,0],ArrowRight:[1,0]
 };
 if(keys[e.key]){
 e.preventDefault();
 change(...keys[e.key]);
 }
});
draw();
</script>
</body>
  </html>
